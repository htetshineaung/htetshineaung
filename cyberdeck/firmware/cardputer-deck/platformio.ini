; Cardputer "deck" firmware: USB keyboard + status/notification screen for a Raspberry Pi.
;
;   pio run -t upload        (hold G0 while plugging in if the port does not appear)
;
; Arduino IDE instead: board "M5Cardputer" (or "M5StampS3"), then
;   Tools > USB Mode         = USB-OTG (TinyUSB)
;   Tools > USB CDC On Boot  = Enabled
; and install the "M5Cardputer" library (pulls M5Unified + M5GFX).

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Cardputer
build_unflags =                   ; board default is HW-CDC/JTAG mode; we need TinyUSB
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0          ; TinyUSB device stack -> HID keyboard + CDC serial
    -DARDUINO_USB_CDC_ON_BOOT=1   ; `Serial` is the USB CDC port the Pi talks to
    -DDECK_LINK_UART=0            ; 1 = talk to the Pi over the Grove UART instead of USB

; Wired-UART variant (Grove G1/G2 <-> Pi 5 UART JST). The Pi daemon injects keys via uinput.
[env:cardputer-uart]
extends = env:cardputer
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDECK_LINK_UART=1
